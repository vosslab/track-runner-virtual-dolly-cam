track_runner: 3
detection:
  model: yolov8n
  confidence_threshold: 0.25
processing:
  crop_mode: direct_center
  crop_aspect: '16:9'
  # crop height = torso_height_multiple x tracked torso height
  # (averaged with the width-driven equivalent crop_h = multiple * raw_w / aspect).
  # Larger number = more surroundings. 8 is a wide, forgiving default.
  torso_height_multiple: 8
  # forward-backward EMA on the desired crop height; prevents the
  # zoom from bouncing on per-frame torso-bbox jitter. 0 disables.
  crop_post_smooth_size_strength: 0.15
  # explicit output pixel resolution; must match crop_aspect.
  # omit to use the median of all crop rectangles (auto)
  output_resolution: [1920, 1080]
  video_codec: libx264
  crf: 18
  encode_filters:
  - bilateral
  - auto_levels
  - hqdn3d
camera:
  zoom_type: fixed
  zoom_levels:
  - 1
  camera_height: elevated
  camera_position: side
  track_size: 400
walker_costs:
  # Viterbi path-selection cost weights (pairwise velocity-delta scoring; WP-COST-1).
  # All spatial terms are in torso-width units (contract C2). Tune these to trade
  # smooth-trajectory preference against residual-motion evidence and skip cost.
  WEIGHT_DISPLACEMENT: 0.25
  WEIGHT_SPEED_DELTA: 1.0
  WEIGHT_HEADING_DELTA: 0.5
  WEIGHT_OVERSPEED: 4.0
  WEIGHT_EVIDENCE_NORM: 0.5
  SKIP_COST: 2.0

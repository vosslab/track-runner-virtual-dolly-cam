track_runner: 3
detection: {}
processing:
  crop_mode: direct_center
  crop_aspect: '16:9'
  # crop height = torso_height_multiple x tracked torso height
  # (averaged with the width-driven equivalent crop_h = multiple * raw_w / aspect).
  # Larger number = more surroundings. 8 is a wide, forgiving default.
  torso_height_multiple: 8
  # explicit output pixel resolution; must match crop_aspect.
  # omit to use the median of all crop rectangles (auto)
  output_resolution: [1920, 1080]
  video_codec: libx264
  crf: 18
  encode_filters:
  - bilateral
  - auto_levels
  - hqdn3d
camera:
  zoom_type: fixed
  zoom_levels:
  - 1
  camera_height: elevated
  camera_position: side
  track_size: 400

# Track runner visual palette.
# Edit this file to customize overlay appearance.
# All color values are hex RGB strings (#RRGGBB).
# Opacity values are 0.0 (invisible) to 1.0 (opaque).

# -- Global defaults for box overlay styles --
# Per-role entries inherit these unless they override a specific field.
# Change fill_opacity here to adjust all overlays at once.
defaults:
  fill_opacity: 0.06
  line_style: solid
  thickness_tier: normal

# -- Thickness tiers (scale multiplier for base line width) --
thickness_tiers:
  normal: 1.0
  heavy: 2.0

# -- Annotation state: what the seed means --
# Rendered states override defaults where they differ.
# not_in_frame is color-only: no box overlay, used for status text only.
seed_status:
  visible:
    color: "#22C55E"
    thickness_tier: heavy
  partial:
    color: "#F59E0B"
    thickness_tier: heavy
  approximate:
    color: "#F97316"
    thickness_tier: heavy
  not_in_frame:
    color: "#94A3B8"

# -- Algorithm output: predictions from propagator --
predictions:
  forward:
    color: "#EF4444"
    line_style: dashed
  backward:
    color: "#FF00FF"
    line_style: dashed
  blended:
    color: "#06B6D4"
    line_style: solid
  consensus:
    color: "#FBBF24"
    line_style: dotted

# -- Pre-race reference: torso box from averaged pre-race seeds --
pre_race_reference:
  color: "#0D9488"

# -- Tracking source: how the tracker produced a box (debug overlay) --
tracking_source:
  detection: "#64C896"
  propagated: "#F97316"
  hold_last: "#FF6400"
  fallback: "#C85000"
  merged: "#00FFFF"
  approx_seed_hint: "#F97316"
  competitor: "#FF0000"
  lost: "#C80000"

# -- Workspace mode: which editing mode is active --
workspace_mode:
  seed: "#0D9488"
  target: "#3B82F6"
  edit: "#8B5CF6"

# -- Interaction state: drawing sub-modes --
draw_mode_badge:
  approximate: "#F97316"
  partial: "#F59E0B"

# -- Preview box: user-drawn confirmation box --
preview_box:
  color: "#22C55E"
  fill_opacity: 0.24
  thickness_tier: heavy

# -- Fonts: family fallback chains and sizes --
# Qt does not do CSS-style fallback; overlay_config probes each candidate.
fonts:
  ui_family: "Helvetica Neue, Helvetica, Arial, sans-serif"
  mono_family: "Menlo, SF Mono, Consolas, monospace"
  overlay_size: 10
  status_size: 12

# -- Theme: dark UI depth colors --
theme:
  surface: "#1A1A2E"
  surface_raised: "#25253E"
  border_subtle: "#2A2A44"
  text_secondary: "#94A3B8"
  text_muted: "#64748B"

# -- Severity: interval quality severity badge colors --
severity:
  high:
    color: "#EF4444"
    label: "HIGH"
  medium:
    color: "#F59E0B"
    label: "MED"
  low:
    color: "#22C55E"
    label: "LOW"

# -- Shared overlay presentation settings --
# These control debug overlay blending, not semantic meaning.
encoder_overlay:
  box_opacity: 0.55
  text_opacity: 0.70

# -- Blob walker v2 tile overlays --
# Used by tools/blob_walk_v2/walk_render.py to render per-frame PNG tiles
# with blob ellipses, prior markers, and acceptance-box outlines.
walker_overlays:
  winner: "#FFD000"
  corridor_non_winner: "#06B6D4"
  raw_outside_corridor: "#808080"
  rejected_winner: "#FF6464"
  prior_cross: "#FF00FF"
  acceptance_box: "#FBBF24"
  audit_disagreement: "#FFFFFF"

# -- Blob walker v2 overlay palette (per-tile PNG-baked vector overlays) --
# Used by tools/blob_walk_v2/walk_render.py to bake velocity vectors,
# allowed-jump circles, and residual lines directly into PNG tiles.
# Also used by tools/blob_walk_v2/walk_html.py for trajectory PNG generation
# (FWD/BWD polylines, seed markers).
walk_overlays:
  velocity_vector: "#FBBF24"
  allowed_jump_circle: "#06B6D4"
  residual_accept: "#10B981"
  residual_reject: "#EF4444"
  trajectory_fwd: "#FFD000"
  trajectory_bwd: "#FF00FF"
  seed_marker: "#FFFFFF"

# -- Motion heat-map overlay (GUI diagnostic view aid) --
# Sticky-mode ROI overlay rendered by track_runner/ui/heat_map_overlay.py,
# composed by track_runner/residual_heat_map.py. Below-threshold pixels
# render as grayscale of the source frame (luminance preserved, color
# removed). Above-threshold pixels render as JET-colorized residual
# blended with the original color frame at blend_alpha. The final
# pixmap is opaque: blend_alpha is an INTERNAL mix weight for the JET
# layer over the color frame in above-threshold pixels, NOT a Qt-level
# opacity.
heat_map:
  colormap: jet
  fixed_max: 30.0
  blend_alpha: 0.40
  window_seconds: 0.133333
  threshold: 10.0
  outline_rgb: [160, 160, 160]
  legend_text: "motion low -> high: blue -> cyan -> yellow -> red"
  missing_transform_note: "camera motion not compensated"

# -- Blob walker v2 SVG overlay status colors --
# Used by walk_html.py legend and any SVG-based per-frame overlays.
# Five primary statuses per schema v13; two legacy v12 statuses for read compat.
walk_svg_overlays:
  status_colors:
    # v13 primary statuses
    accepted: "#00cc00"
    # accepted: confirmed on path (bright green)
    interpolated: "#60b4e8"
    # interpolated: inferred between accepted bracket (pale blue)
    extrapolated: "#e8c840"
    # extrapolated: velocity-projected past last accept (yellow)
    soft_miss_no_blob: "#888888"
    # soft_miss_no_blob: extraction returned empty list (gray)
    soft_miss_no_path: "#e87060"
    # soft_miss_no_path: candidates present but no plausible path survived (pale red)
    # Terminal markers
    after_walk_terminated: "#444444"
    hit_neighbor_seed: "#444444"
    boundary: "#444444"
    # Legacy v12 values (never emitted by v13 walker; backward read compat only)
    rejected_motion_gate: "#ff0000"
    soft_miss_low_conf: "#ff8800"
